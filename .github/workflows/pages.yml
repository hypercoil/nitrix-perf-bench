# Build the nitrix-perf-bench HTML /site from committed L4 rows (+ nitrix's
# capability op_matrix) and publish it to GitHub Pages.
#
# The site is generated, never committed (``/site`` is git-ignored): the single
# source of truth is the committed ``reports/*.jsonl``, so the published page is
# always reproducible from data.
#
# Structure: a `build` job (the only one that uploads the Pages artifact) feeds
# a `deploy` job (the canonical GitHub Pages split).  Re-running a workflow
# reuses the same run id, so a prior attempt's `github-pages` artifact lingers
# and `deploy-pages` aborts with "Multiple artifacts named github-pages ...
# count is 2"; the build job deletes any stale one before uploading, so exactly
# one ever exists.
#
# One-time setup in the repo:
#   1. Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
#   2. nitrix is a sibling *path* dependency (../nitrix) AND the source of the
#      capability matrix, so it is checked out alongside.  If nitrix lives under
#      a different owner, or is private and this repo's GITHUB_TOKEN can't read
#      it, set:
#        - NITRIX_REPO  variable  (e.g. "myorg/nitrix"; defaults to
#          "<this-owner>/nitrix")
#        - NITRIX_TOKEN secret    (a PAT with read access to nitrix; falls back
#          to the default GITHUB_TOKEN, which only works if nitrix is public or
#          in the same repo's permissions)
name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

# build needs contents:read (+ actions:write to prune stale artifacts);
# deploy needs pages:write + id-token:write.
permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

# One Pages deployment at a time; do NOT cancel an in-flight deploy (canonical
# Pages setting — a queued run waits rather than killing a live publish).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nitrix-perf-bench
        uses: actions/checkout@v4
        with:
          path: nitrix-perf-bench

      - name: Checkout nitrix (sibling path dep + capability matrix)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.NITRIX_REPO || format('{0}/nitrix', github.repository_owner) }}
          token: ${{ secrets.NITRIX_TOKEN || github.token }}
          path: nitrix

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build site from committed rows + nitrix capability matrix
        working-directory: nitrix-perf-bench
        env:
          JAX_PLATFORMS: cpu  # CI runners are CPU-only
        run: |
          uv run nperf --site site \
            --render-from reports \
            --op-matrix ../nitrix/docs/op_matrix.json

      - name: Guard — fail if anything host-specific leaked into the page
        working-directory: nitrix-perf-bench
        run: |
          if grep -qiE '/(root|home|output|opt|tmp)/|NPERF_PYTHON|CUDA_VISIBLE|cpu_affinity|\b(secret|password|api[_-]?key)\b|BEGIN [A-Z ]*PRIVATE KEY' site/index.html; then
            echo "::error::potential host path / credential in published site"
            exit 1
          fi
          echo "site clean (no host paths / credentials)"

      - name: Prune stale Pages artifact from earlier run attempts
        # A re-run keeps the same run id, so a previous attempt's
        # "github-pages" artifact survives and would collide with the upload
        # below (deploy-pages: "Multiple artifacts ... count is 2").  Delete any
        # before uploading so the run has exactly one.  Best-effort.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name=="github-pages") | .id') || ids=""
          for id in $ids; do
            echo "deleting stale github-pages artifact $id"
            gh api -X DELETE \
              "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: nitrix-perf-bench/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
