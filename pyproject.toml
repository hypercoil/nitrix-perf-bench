[build-system]
requires = ["setuptools >=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nitrix-perf-bench"
version = "0.0.0.dev0"
description = "Performance benchmark suite for nitrix (see DESIGN.md)."
requires-python = ">=3.11"
# Core deps only.  jax lives in the platform dependency-groups below (the
# CPU vs CUDA variant is the conflicting axis of the platform matrix, L6).
# ``scipy`` is a *reference* library (scipy.ndimage / .signal / .sparse): the
# perf-bench suite may depend on it (DESIGN §0); only *nitrix* may not.  It is
# platform-agnostic (host CPU, the ``scipy`` provider's numpy framework), so it
# is a core dep rather than a per-platform group entry.
dependencies = [
    "numpy >= 2.0",
    "scipy >= 1.13",
]

[project.scripts]
nperf = "nperf.run:main"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Environment matrix (DESIGN §6/§7).  Each platform is a dependency-group; the
# runner activates one per subprocess worker via ``uv run --group <env>``.
# ``jax-cpu`` and ``jax-cuda12`` are the same package with different variants,
# so they are declared as conflicting (see [tool.uv]).
#
# The throwaway case is framework-trivial (jax + numpy only); the first real
# case (P0b, semiring_matmul) brings in ``nitrix`` -- the system under test --
# as a path source (DESIGN §7: pinned by SHA, recorded in provenance).  It sits
# in the platform groups beside jax, not in the core ``dependencies``, so the
# nitrix-vs-jax coupling is per-env (and the throwaway stays nitrix-free).  The
# refs-torch / refs-pyg envs land in P2.
# ---------------------------------------------------------------------------
[dependency-groups]
jax-cpu = ["jax == 0.10.0", "nitrix"]
jax-cuda12 = ["jax[cuda12] == 0.10.0", "nitrix"]
# GPU reference env (Phase B): CuPy is the GPU twin of numpy/scipy -- the
# apples-to-apples on-target reference for the audit ops (cupy.cov, cuSOLVER
# lstsq, cupyx.scipy.ndimage).  Isolated from the main jax env in its own venv
# (UV_PROJECT_ENVIRONMENT), per DESIGN §7 / COVERAGE_MANDATE Thrust 3.  A
# superset: jax + nitrix (every worker rebuilds the shared oracle / inputs) +
# cupy for the baseline.  cupy-cuda12x coexists with jax[cuda12] (same CUDA-12
# family; cf. the jax+torch refs precedent), and is GPU-only so its provider is
# marked requires='gpu' (skipped, not run, on the CPU platform).
refs-cupy = ["jax[cuda12] == 0.10.0", "nitrix", "cupy-cuda12x"]
dev = ["pytest", "ruff"]

[tool.uv]
default-groups = ["jax-cpu", "dev"]
conflicts = [
    [{ group = "jax-cpu" }, { group = "jax-cuda12" }],
    [{ group = "jax-cpu" }, { group = "refs-cupy" }],
]

[tool.uv.sources]
nitrix = { path = "../nitrix", editable = true }

[tool.ruff]
line-length = 79
lint.select = ["E", "F", "W", "I001"]

[tool.ruff.format]
quote-style = "single"
